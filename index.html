<!DOCTYPE html>
<!--
Project: Image Gallery (Internship Task 1)
Description: Responsive image gallery with lightbox view, next/prev navigation,
hover effects, and category filtering.
Author: [Adzorge Richard Quarshie]
-->
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Image Gallery</title>
        <link rel="icon" type="image/x-icon" href="favicon.ico">
        <meta name="description" content="A responsive image gallery built with HTML, CSS, and JavaScript, featuring a lightbox view, next/prev navigation, and category filters.">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="top-bar">
            <input type="text" id="searchInput" class="search-input" placeholder="Search photos...">
            <div class="menu-wrapper">
                <button id="menuDots" class="dots-btn">&#8942;</button>
                <div class="dropdown-menu" id="dropdownMenu">
                    <button class="dropdown-item">Edit</button>
                    <button class="dropdown-item">Create</button>
                    <button class="dropdown-item">Sort by name</button>
                    <button class="dropdown-item">Select all</button>
                </div>
            </div>
        </div>
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="nature">Nature</button>
            <button class="filter-btn" data-filter="people">People</button>
            <button class="filter-btn" data-filter="places">Places</button>
        </div>
        <div class="gallery">
            <div class="gallery-item" data-category="people">
                <img src="Images/Photo1.jpg" alt="Photo1">
            </div>
            <div class="gallery-item" data-category="people">
                <img src="Images/Photo2.jpeg" alt="Photo2">
            </div>
            <div class="gallery-item" data-category="people">
                <img src="Images/Photo3.jpg" alt="Photo3">
            </div>
            <div class="gallery-item" data-category="people">
                <img src="Images/Photo4.jpg" alt="Photo4">
            </div>
            <div class="gallery-item" data-category="nature">
                <img src="Images/Photo5.jpg" alt="Photo5"> 
            </div>
            <div class="gallery-item" data-category="nature">
                <img src="Images/Photo6.jpg" alt="Photo6">
            </div>
        <div class="gallery-item" data-category="nature">
            <img src="Images/Photo7.jpg" alt="Photo7">
        </div>
        <div class="gallery-item" data-category="places">
            <img src="Images/Photo8.jpg" alt="Photo8">
        </div>
        <div class="gallery-item" data-category="places">
            <img src="Images/Photo9.jpg" alt="Photo9">
        </div>
        <div class="gallery-item" data-category="places">
            <img src="Images/Photo10.jpeg" alt="Photo10">
        </div>
        </div>
        <div class="albums-view" id="albumsView">
            <div class="album-card" data-album="nature">
                <img src="Images/Photo5.jpg" alt="Nature album">
                <p>Nature</p>
            </div>
            <div class="album-card" data-album="people">
                <img src="Images/Photo1.jpg" alt="People Album">
                <p>People</p>
            </div>
            <div class="album-card" data-album="places">
                <img src="Images/Photo8.jpg" alt="Places album">
                <p>Places</p>
            </div>
        </div>

        <!-- Lightbox -->
        <div class="lightbox" id="lightbox">
            <span class="close-btn" id="closeBtn">&times;</span>
            <span class="prev-btn" id="prevBtn">&#10094;</span>
            <img class="lightbox-img" id="lightboxImg" src="" alt="">
            <span class="next-btn" id="nextBtn">&#10095;</span>
        </div> 

        <!-- Bottom navigation-->
         <div class="bottom-nav">
            <button class="nav-btn active" data-tab="photos">
                <span class="nav-icon">&#128247;</span>
                Photos
            </button>
            <button class="nav-btn" data-tab="albums">
                <span class="nav-icon">&#128193;</span>
                Albums
            </button>
            <button id="hamburgerBtn" class="nav-btn">
                <span class="nav-icon">&#9776;</span>
                Menu
            </button>      
         </div>

         <!-- Hamburger side menu -->
         <div class="side-menu" id="sideMenu">
            <button class="side-menu-item" data-action="videos">Videos</button>
            <button class="side-menu-item" data-action="favorites">Favorites</button>
            <button class="side-menu-item" data-action="recent">Recent</button>
            <button class="side-menu-item" data-action="locations">Locations</button>
            <button class="side-menu-item" data-action="trash">Trash</button>
            <button class="side-menu-item" data-action="settings">Settings</button>
         </div>

        <script src="script.js"></script>
    </body>
    </html>
